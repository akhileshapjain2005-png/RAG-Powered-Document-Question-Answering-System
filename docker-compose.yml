
# RAG-DocQA: AI-Powered Document Question Answering System
# Docker Compose configuration

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-docqa-backend

    environment:
      - ENV=${ENV:-production}
      - ALLOW_ANONYMOUS_ACCESS=${ALLOW_ANONYMOUS_ACCESS:-false}
      - ENABLE_API_DOCS=${ENABLE_API_DOCS:-false}

      # Embedding and vector database
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - VECTOR_STORE_PATH=/app/chroma_db

      # Ollama on the Windows host
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_MODEL=${LLM_MODEL:-llama3.2:latest}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

      # API authentication
      - API_KEY=${API_KEY:-}
      - API_KEYS=${API_KEYS:-}
      - AUTH_MODE=${AUTH_MODE:-jwt_or_api_key}
      - JWT_JWKS_URL=${JWT_JWKS_URL:-}
      - JWT_ISSUER=${JWT_ISSUER:-}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-RS256}
      - JWT_TENANT_CLAIM=${JWT_TENANT_CLAIM:-tenant_id}

      # Statistics, audit logging and metrics
      - STATS_ALLOWED_ROLES=${STATS_ALLOWED_ROLES:-}
      - STATS_ALLOW_API_KEY=${STATS_ALLOW_API_KEY:-true}
      - AUDIT_LOG_ENABLED=${AUDIT_LOG_ENABLED:-true}
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      - METRICS_TOKEN=${METRICS_TOKEN:-}

      # CORS and application limits
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - CORS_ALLOW_CREDENTIALS=${CORS_ALLOW_CREDENTIALS:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MAX_UPLOAD_BYTES=${MAX_UPLOAD_BYTES:-10485760}

      # Rate limiting
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_DEFAULT=${RATE_LIMIT_DEFAULT:-200/minute}
      - RATE_LIMIT_UPLOAD=${RATE_LIMIT_UPLOAD:-20/hour}
      - RATE_LIMIT_ASK=${RATE_LIMIT_ASK:-120/hour}
      - RATE_LIMIT_READ=${RATE_LIMIT_READ:-600/hour}

    # Temporary test database; original databases remain untouched
    volumes:
      - "C:/RAG-DocQA-Chroma-Test:/app/chroma_db"

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

    # Allows Compose to wait for a healthy backend before starting frontend
    # (see depends_on in frontend below)

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_API_KEY: ${VITE_API_KEY:-}

    container_name: rag-docqa-frontend

    ports:
      - "127.0.0.1:3000:80"

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
        test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
        interval: 30s
        timeout: 10s
        retries: 3